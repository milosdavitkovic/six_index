name: Package Check

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build deployable JAR
        shell: pwsh
        run: .\mvnw.cmd -s .mvn/settings-central.xml install

      - name: Confirm deployable artifact
        shell: pwsh
        run: |
          $jar = Get-ChildItem -Path target -Filter *.jar | Where-Object { $_.Name -notlike '*.original.jar' } | Select-Object -First 1
          if (-not $jar) { throw 'No deployable JAR found in target' }
          Write-Host "Found $($jar.Name)"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-jar
          path: target/*.jar
          if-no-files-found: error

