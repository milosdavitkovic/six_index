name: Security scan (Trivy)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  trivy-scan:
    name: Build image and run Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          docker build -t six_index:${{ github.run_id }} .

      - name: Run Trivy scan
        # Use a released tag; replace with a specific v-tag if you prefer
        uses: aquasecurity/trivy-action@v0.33.0
        with:
          image-ref: six_index:${{ github.run_id }}
          format: table
          exit-code: '1'
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

