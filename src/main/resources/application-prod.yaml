spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:?DB_URL must be set in prod}
    username: ${DB_USERNAME:?DB_USERNAME must be set in prod}
    password: ${DB_PASSWORD:?DB_PASSWORD must be set in prod}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:?OAUTH2_ISSUER_URI must be set in prod}

server:
  shutdown: graceful

index-review:
  security:
    enabled: true
